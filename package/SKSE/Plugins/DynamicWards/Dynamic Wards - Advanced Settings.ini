; ============================================================================
;  Dynamic Wards - Advanced Settings (file version 1)
; ============================================================================
;  Fine values the in-game menu does not show. The game reads this file once,
;  when it starts.
;
;  TO CHANGE A VALUE: change the number after the = and save, then start the
;  game. The note above each value says what it does; its default and allowed
;  range are written beside it. A value outside its range is held at the
;  nearest end.
;
;  TO RESET A VALUE: delete its line, or the whole file, and the default
;  comes back - unless your Custom file (below) sets it: take the line out
;  there too.
;
;  TO KEEP YOUR CHANGES THROUGH UPDATES: an update replaces this file. Put
;  only the lines you change, under their [Section], in a file of their own
;  beside this one:
;    Dynamic Wards - Advanced Settings - Custom.ini
;  Its lines win over this file, and no update touches it.
;
;  The menu's own settings (its sliders and switches) stay in the menu.
; ============================================================================
;
;  CONTENTS
;    1. Brightness and Reach
;    2. Vanilla and ENB
;
;  MOST PEOPLE ONLY CHANGE THESE
;    DomeReach          in [Brightness and Reach]
;    HandLightStrength  in [Brightness and Reach]
;
; ============================================================================

; ----------------------------------------------------------------------------
;  1. BRIGHTNESS AND REACH
;  How bright the lights are and how far they reach, beyond the menu's sliders.
; ----------------------------------------------------------------------------
[Brightness and Reach]

; How far a ward dome's light reaches, in multiples of the hand light's reach.
DomeReach         = 2.25  ; default 2.25 - range 0.5 to 5

; How bright a ward dome's light is, on top of Opacity and Ward brightness: 1 as made.
DomeLightStrength = 1     ; default 1 - range 0.1 to 4

; How far the light on a hand casting a ward reaches: 1 as made.
HandLightReach    = 1     ; default 1 - range 0.25 to 4

; How bright the light on a hand casting a ward is, on top of Hand Brightness: 1 as made.
HandLightStrength = 1     ; default 1 - range 0.1 to 4

; ----------------------------------------------------------------------------
;  2. VANILLA AND ENB
;  Values used only without Community Shaders.
; ----------------------------------------------------------------------------
[Vanilla and ENB]

; On ENB, the least color the ward's small glow keeps: 0 lets a pale ward stay pale.
SpriteColor = 0.75  ; default 0.75 - range 0 to 1
